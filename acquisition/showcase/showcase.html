<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:#0b0d10}
#stage{position:relative;width:540px;height:960px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#f4f1ea;
  background:radial-gradient(120% 80% at 50% 0%,#16202c 0%,#0b0d10 60%)}
.abs{position:absolute}
.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#ffc857;font-weight:600}
.h{font-size:38px;line-height:1.08;font-weight:700}
.chip{position:absolute;padding:8px 13px;border-radius:999px;background:#1a2230;border:1px solid #2a3546;font-size:13px;white-space:nowrap;font-weight:500}
.chip.dead{color:#6b7380;text-decoration:line-through;background:#13171d;border-color:#1d232c}
.card{position:absolute;background:#141a23;border:1px solid #273142;border-radius:18px}
.fact{position:absolute;left:40px;right:40px;padding:14px 18px;border-radius:14px;background:#141a23;border:1px solid #273142;display:flex;justify-content:space-between;font-size:15px}
.fact b{color:#ffc857;font-weight:600}
.phone{position:absolute;width:300px;height:620px;border-radius:40px;background:#000;border:6px solid #2b3240;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.tag{position:absolute;padding:9px 14px;border-radius:12px;background:#ffc857;color:#14110a;font-weight:700;font-size:14px;white-space:nowrap}
.seg{position:absolute;top:0;height:100%;border-radius:6px}
.btn{position:absolute;left:50%;padding:20px 34px;border-radius:999px;background:#ffc857;color:#14110a;font-weight:700;font-size:22px;white-space:nowrap}
</style></head>
<body><div id="stage"></div>
<script>
const NAMES = ["A to Z Zack of All Trades LLC","YY 328 WALNUT LLC","Nourri by SLT LLC","Curation Living LLC","NCNC Ventures LLC",
"AMADO'S CONSTRUCTION LLC","Fluffy Chicks & Co. LLC","H&C 524 L.L.C.","The Coop Cap, LLC","PM Masonry LLC","REF MADISON LLC",
"Anew Leaf Psychiatry PLLC","Whistle My Ride LLC","GN NORTH AMERICA, LLC","Velocity Xpress LLC","Virelum Studios LLC",
"Top Choice Answering Service LLC","Vitanorra LLC","Marlows LLC","Garnet llc","Abzun & Morales Group LLC","MyWatchBox LLC",
"Funded Media L.L.C.","The Color Black Bull LLC","Pinnacle Express llc","Shoreline Pipe & Heat LLC","JIAME LLC","Lanigan Consulting, LLC"];
const DEAD = new Set(["YY 328 WALNUT LLC","NCNC Ventures LLC","H&C 524 L.L.C.","REF MADISON LLC","GN NORTH AMERICA, LLC","JIAME LLC","The Coop Cap, LLC"]);
const SITE = {h: 16085, sections: {hero:178, services:1885, packages:5018, about:8498, areas:10770}};

const st = document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const out=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const vis=(t,a,b,f=.4)=>Math.min(out(p(t,a,a+f)),1-p(t,b-f,b)); // fade in at a, out by b
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
function set(e,o,x=0,y=0,s=1){e.style.opacity=o;e.style.transform=`translate(${x}px,${y}px) scale(${s})`;e.style.visibility=o<=0.001?'hidden':'visible'}

// ---------- build all nodes once
const N = {};
N.s1eb = st.appendChild(el(`<div class="abs eyebrow" style="left:40px;top:300px">Yesterday in Connecticut</div>`));
N.s1n  = st.appendChild(el(`<div class="abs serif" style="left:36px;top:322px;font-size:150px;font-weight:700;color:#fff">0</div>`));
N.s1t  = st.appendChild(el(`<div class="abs h serif" style="left:40px;top:500px;width:460px">new businesses registered.</div>`));
N.s1s  = st.appendChild(el(`<div class="abs" style="left:40px;top:600px;font-size:18px;color:#aab3c0;width:440px">Every single one with an email on file.</div>`));

N.s2h = st.appendChild(el(`<div class="abs h serif" style="left:40px;top:90px;width:460px"></div>`));
N.chips = NAMES.map((n,i)=>st.appendChild(el(`<div class="chip">${n.replace(/&/g,'&amp;')}</div>`)));

N.s3eb = st.appendChild(el(`<div class="abs eyebrow" style="left:40px;top:110px">Step 1 · Research</div>`));
N.s3h  = st.appendChild(el(`<div class="abs h serif" style="left:40px;top:136px;width:460px">We study them like a client.</div>`));
N.s3c  = st.appendChild(el(`<div class="card" style="left:40px;right:40px;top:250px;padding:22px">
  <div style="font-size:12px;color:#8b95a5;letter-spacing:.1em;text-transform:uppercase">Registered yesterday</div>
  <div class="serif" style="font-size:28px;margin-top:6px">Shoreline Pipe &amp; Heat LLC</div>
  <div style="color:#aab3c0;margin-top:4px">East Haven, CT · Residential remodelers</div></div>`));
const FACTS=[["Owner","Mike Russo"],["CT P-1 Plumbing Contractor","since 1999"],["Heating &amp; cooling license","since 1996"],["Google reviews","none yet"],["Website","none"]];
N.facts = FACTS.map(([a,b],i)=>st.appendChild(el(`<div class="fact" style="top:${400+i*64}px"><span>${a}</span><b>${b}</b></div>`)));
N.s3v = st.appendChild(el(`<div class="abs" style="left:40px;right:40px;top:740px;font-size:19px;line-height:1.4;color:#fff">→ "27 years on the tools. Now it's his name on the truck."</div>`));

N.s4eb = st.appendChild(el(`<div class="abs eyebrow" style="left:40px;top:70px">Step 2 · Build</div>`));
N.s4h  = st.appendChild(el(`<div class="abs h serif" style="left:40px;top:96px;width:470px">Then we build their website.</div>`));
N.phone = st.appendChild(el(`<div class="phone" style="left:120px;top:210px"><img id="siteimg" src="site.png" style="width:288px;display:block"></div>`));
N.tags = [["Their services",-6],["Real towns they serve",2],["Local SEO + schema",-3],["Claim it · $499",4]]
  .map(([t,r])=>st.appendChild(el(`<div class="tag" style="transform:rotate(${r}deg)">${t}</div>`)));

N.s5eb = st.appendChild(el(`<div class="abs eyebrow" style="left:40px;top:70px">Step 3 · Video</div>`));
N.s5h  = st.appendChild(el(`<div class="abs h serif" style="left:40px;top:96px;width:470px">And record a video just for them.</div>`));
N.vphone = st.appendChild(el(`<div class="phone" style="left:120px;top:205px;height:560px">
   <div style="position:absolute;inset:0 0 auto 0;height:330px;overflow:hidden"><img src="site.png" style="width:288px;display:block;margin-top:-104px"></div>
   <div style="position:absolute;left:0;right:0;top:330px;bottom:0;background:linear-gradient(#2a3140,#151a22)">
     <div style="position:absolute;left:50%;top:38px;width:110px;height:110px;margin-left:-55px;border-radius:50%;background:#d9b08c"></div>
     <div style="position:absolute;left:50%;top:150px;width:190px;height:120px;margin-left:-95px;border-radius:95px 95px 0 0;background:#3c4a63"></div>
   </div>
   <div id="cap" style="position:absolute;left:0;right:0;top:470px;text-align:center;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 6px #000"></div>
 </div>`));
N.bar = st.appendChild(el(`<div class="abs" style="left:40px;right:40px;top:800px;height:22px;background:#1a2230;border-radius:6px"></div>`));
// segments as % of a 44s master: slot windows are 1.2-2.9 and 6.4-8.6
[[0,2.7,'#5d6878'],[2.7,6.6,'#ffc857'],[6.6,14.5,'#5d6878'],[14.5,19.5,'#ffc857'],[19.5,100,'#5d6878']]
  .forEach(([a,b,c])=>N.bar.appendChild(el(`<div class="seg" style="left:${a}%;width:${b-a}%;background:${c}"></div>`)));
N.barl = st.appendChild(el(`<div class="abs" style="left:40px;right:40px;top:832px;display:flex;justify-content:space-between;font-size:14px;color:#aab3c0">
  <span><b style="color:#fff">90%</b> real you</span><span><b style="color:#ffc857">10%</b> their name, AI lip-synced</span></div>`));

N.s6eb = st.appendChild(el(`<div class="abs eyebrow" style="left:40px;top:110px">Step 4 · Deliver</div>`));
N.s6h  = st.appendChild(el(`<div class="abs h serif" style="left:40px;top:136px;width:470px">It lands in their inbox and their feed.</div>`));
N.mail = st.appendChild(el(`<div class="card" style="left:40px;right:40px;top:290px;padding:20px">
  <div style="font-size:12px;color:#8b95a5">Inbox · now</div>
  <div style="font-weight:700;font-size:18px;margin-top:6px">Mike, I built Shoreline Pipe &amp; Heat a website</div>
  <div style="color:#aab3c0;margin-top:6px;font-size:15px">Saw you just registered with the state. Congrats. Here's a 40-second walkthrough…</div></div>`));
N.ig = st.appendChild(el(`<div class="card" style="left:40px;right:40px;top:440px;padding:20px;display:flex;gap:14px;align-items:center">
  <div style="width:46px;height:46px;border-radius:12px;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5)"></div>
  <div><div style="font-size:12px;color:#8b95a5">Instagram · Sponsored</div><div style="font-weight:700;font-size:17px;margin-top:3px">Your video, retargeted to you</div></div></div>`));
N.btn = st.appendChild(el(`<div class="btn" style="top:610px">Claim it · $499</div>`));

N.endh = st.appendChild(el(`<div class="abs serif" style="left:40px;top:330px;width:470px;font-size:52px;line-height:1.04;font-weight:700">100 personalised websites.<br><span style="color:#ffc857">Every morning.</span></div>`));
N.endb = st.appendChild(el(`<div class="abs" style="left:40px;top:560px;font-size:20px;color:#aab3c0;font-weight:600;letter-spacing:.02em">RationalGo</div>`));

// ---------- per-frame
window.render = function(t){
  // S1 0-4.6
  const a1 = vis(t,0.2,4.6);
  set(N.s1eb,a1,0,(1-out(p(t,.2,.8)))*20);
  N.s1n.textContent = Math.round(186*io(p(t,.4,2.4)));
  set(N.s1n,a1,0,(1-out(p(t,.3,.9)))*30);
  set(N.s1t,vis(t,.9,4.6),0,(1-out(p(t,.9,1.5)))*20);
  set(N.s1s,vis(t,2.6,4.6),0,(1-out(p(t,2.6,3.2)))*16);

  // S2 4.6-10.2  names rain, dead ones struck, headline changes
  const a2 = vis(t,4.6,10.2);
  N.s2h.textContent = t<6.8 ? "186 names." : t<8.4 ? "Landlords & holding LLCs out." : "Top 100 make the cut.";
  set(N.s2h,a2,0,(1-out(p(t,4.6,5.2)))*20);
  N.chips.forEach((c,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const x = 40 + col*235 + (row%2)*18;
    const y = 300 + row*46 - (t-4.6)*14;
    const appear = out(p(t,4.7+row*.08,5.2+row*.08));
    const dead = DEAD.has(NAMES[i]) && t>6.8;
    c.className = 'chip'+(dead?' dead':'');
    const hero = NAMES[i].startsWith('Shoreline');
    let o = a2*appear*(dead? 1-0.7*p(t,6.8,7.6) : 1)*clamp((y-250)/40);
    if (t>8.4 && !hero) o *= 1-0.6*p(t,8.4,9);
    c.style.left=x+'px'; c.style.top=y+'px';
    c.style.background = hero && t>8.4 ? '#ffc857' : '';
    c.style.color = hero && t>8.4 ? '#14110a' : '';
    set(c,o,0,0,hero && t>8.4 ? 1+0.15*out(p(t,8.4,9)) : 1);
  });

  // S3 10.2-16.4
  const a3 = vis(t,10.2,16.4);
  set(N.s3eb,a3); set(N.s3h,a3,0,(1-out(p(t,10.2,10.8)))*20);
  set(N.s3c,a3,0,(1-out(p(t,10.5,11.1)))*30);
  N.facts.forEach((f,i)=>set(f,Math.min(a3,out(p(t,11.3+i*.45,11.8+i*.45))),(1-out(p(t,11.3+i*.45,11.8+i*.45)))*-40));
  set(N.s3v,Math.min(a3,out(p(t,14,14.6))),0,(1-out(p(t,14,14.6)))*12);

  // S4 16.4-23.4 site scroll
  const a4 = vis(t,16.4,23.4);
  set(N.s4eb,a4); set(N.s4h,a4,0,(1-out(p(t,16.4,17)))*20);
  set(N.phone,a4,0,(1-out(p(t,16.5,17.3)))*80);
  const k=[[17.2,'hero'],[18.6,'services'],[20.0,'packages'],[21.3,'about'],[22.4,'areas']];
  let y=SITE.sections.hero;
  for(let i=1;i<k.length;i++){ const q=io(p(t,k[i][0]-.8,k[i][0])); if(q>0) y = SITE.sections[k[i-1][1]] + (SITE.sections[k[i][1]]-SITE.sections[k[i-1][1]])*q; }
  document.getElementById('siteimg').style.transform=`translateY(${-y*288/1080}px)`;
  const tagPos=[[18.4,18,330],[22.2,330,520],[20.5,14,700],[19.6,350,232]];
  N.tags.forEach((g,i)=>{const [tt,x,yy]=tagPos[i]; g.style.left=x+'px'; g.style.top=yy+'px';
    const q=out(p(t,tt,tt+.35)); g.style.opacity=Math.min(a4,q); g.style.visibility=Math.min(a4,q)<=0?'hidden':'visible';
    g.style.scale = .6+.4*q; });

  // S5 23.4-30.2 video
  const a5 = vis(t,23.4,30.2);
  set(N.s5eb,a5); set(N.s5h,a5,0,(1-out(p(t,23.4,24)))*20);
  set(N.vphone,a5,0,(1-out(p(t,23.5,24.3)))*80);
  const full="Shoreline Pipe & Heat"; const n=Math.round(full.length*p(t,24.6,25.8));
  document.getElementById('cap').textContent = full.slice(0,n);
  set(N.bar,Math.min(a5,out(p(t,26.2,26.8)))); set(N.barl,Math.min(a5,out(p(t,26.8,27.4))));

  // S6 30.2-35.6 deliver + claim
  const a6 = vis(t,30.2,35.6);
  set(N.s6eb,a6); set(N.s6h,a6,0,(1-out(p(t,30.2,30.8)))*20);
  set(N.mail,Math.min(a6,out(p(t,30.6,31.2))),0,(1-out(p(t,30.6,31.2)))*40);
  set(N.ig,Math.min(a6,out(p(t,31.4,32))),0,(1-out(p(t,31.4,32)))*40);
  const press = p(t,33.4,33.6), rel = p(t,33.6,33.9);
  N.btn.textContent = t<33.6 ? "Claim it · $499" : "Claimed ✓";
  N.btn.style.background = t<33.6 ? '#ffc857' : '#5fd38d';
  set(N.btn,Math.min(a6,out(p(t,32.3,32.8))),-N.btn.offsetWidth/2,0,1-0.08*press+0.08*rel);

  // End 35.6-40
  set(N.endh,out(p(t,35.8,36.5)),0,(1-out(p(t,35.8,36.5)))*24);
  set(N.endb,out(p(t,36.6,37.2)));
};
window.DURATION = 40;
render(0);
</script></body></html>
