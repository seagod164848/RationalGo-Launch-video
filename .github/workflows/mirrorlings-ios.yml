name: mirrorlings-ios
on:
  push:
    paths: ["mirrorlings-ios/**", ".github/workflows/mirrorlings-ios.yml"]
  pull_request:
    paths: ["mirrorlings-ios/**", ".github/workflows/mirrorlings-ios.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults: {run: {working-directory: mirrorlings-ios}}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Mirrorlings.xcodeproj -target Mirrorlings -sdk iphoneos \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
